{# 保留主题的移动抽屉行为，用完整字标替代“图标 + 重复品牌文字”。 #}
{% if sidebars|length > 0 %}
<aside id="left-sidebar"
  class="fixed inset-y-0 left-0 md:top-14 z-50 md:z-30 bg-background md:bg-transparent transition-all duration-100 -translate-x-full md:translate-x-0 ml-0 p-6 md:p-0 md:-ml-2 md:h-[calc(100vh-3.5rem)] w-5/6 md:w-full overflow-y-auto border-r border-border md:sticky"
  x-data="{ mobile: window.innerWidth < 768 }" @resize.window="mobile = window.innerWidth < 768"
  @keydown.escape.window="showSidebar = false"
  :aria-hidden="mobile && !showSidebar" :class="{ 'translate-x-0': showSidebar }">
  <a href="{{ pathto(master_doc) }}" class="ms-sidebar-brand md:!hidden"
     aria-label="MS-Agent {{ '文档首页' if ms_zh else 'documentation home' }}">
    <img src="{{ pathto('_static/images/ms-agent-logo.png', 1) }}" alt="MS-Agent" width="135" height="22" />
  </a>
  <div class="relative overflow-hidden md:overflow-auto my-4 md:my-0">
    <div class="overflow-y-auto h-full w-full relative pr-6">
      {% for section in sidebars %}{% include section %}{% endfor %}
    </div>
  </div>
  <button type="button" @click="showSidebar = false" class="absolute md:hidden right-4 top-4 rounded-sm"
          aria-label="{{ '关闭导航' if ms_zh else 'Close navigation' }}">✕</button>
</aside>
{% endif %}
