[project]
name = "ms-agent-webui-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "exa-py>=2.16.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "loguru>=0.7.3",
    "mem0ai>=2.0.12",
    "ms-agent",
    "pydantic-settings>=2.14.2",
    "sse-starlette>=3.4.5",
    "uvicorn[standard]>=0.50.2",
]

[project.scripts]
dev = "app.main:dev"
serve = "app.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# Belt to the launcher's own probe: the sync commands rely on --locked and
# --inexact, so refuse outright on a uv too old to honour them.
required-version = ">=0.5.0"

[tool.uv.sources]
# This backend is developed and launched from the containing ms-agent checkout.
# Keeping the SDK editable prevents the WebUI from silently running a stale Git
# pin after framework code changes.
ms-agent = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
